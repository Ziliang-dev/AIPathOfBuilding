name: Create new installer
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build'
        required: true
        default: 'v2.x.x'
      aipob_package_url:
        description: 'URL of the canonical AIPoB portable package produced by the release gate'
        required: false
      aipob_package_sha256:
        description: 'Optional SHA256 of the canonical AIPoB package archive'
        required: false
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
defaults:
  run:
    shell: bash
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout AIPoB source
        uses: actions/checkout@v4
        with:
          path: aipob

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download and verify canonical AIPoB package
        env:
          AIPOB_PACKAGE_URL: ${{ github.event.inputs.aipob_package_url || format('https://github.com/{0}/releases/download/{1}/AIPathOfBuilding-AIPoB-windows-x64.zip', github.repository, github.event.release.tag_name) }}
          AIPOB_PACKAGE_SHA256: ${{ github.event.inputs.aipob_package_sha256 }}
        run: |
          package_path="$RUNNER_TEMP/AIPathOfBuilding-AIPoB-windows-x64.zip"
          test -n "$AIPOB_PACKAGE_URL"
          python -c "import sys,urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$AIPOB_PACKAGE_URL" "$package_path"
          if test -n "$AIPOB_PACKAGE_SHA256"; then
            actual="$(python -c "import sys;sys.path.insert(0,'aipob/scripts');from pathlib import Path;from windows_package import sha256;print(sha256(Path(sys.argv[1])))" "$package_path")"
            test "${actual,,}" = "${AIPOB_PACKAGE_SHA256,,}"
          fi
          python aipob/scripts/aipob.py verify-package-windows --package "$package_path"
          echo "AIPOB_PACKAGE_PATH=$package_path" >> "$GITHUB_ENV"

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build and verify installer from canonical staging
        run: |
          installer_path="$RUNNER_TEMP/AIPathOfBuilding-AIPoB-Setup.exe"
          python aipob/scripts/aipob.py package-installer-windows --package "$AIPOB_PACKAGE_PATH" --output "$installer_path"
          python aipob/scripts/aipob.py verify-installer-windows --installer "$installer_path" --package "$AIPOB_PACKAGE_PATH"
          echo "AIPOB_INSTALLER_PATH=$installer_path" >> "$GITHUB_ENV"

      - name: Upload installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ github.event.release.tag_name || github.event.inputs.tag_name }}'
          gh release upload "$tag" "$AIPOB_INSTALLER_PATH" --clobber -R '${{ github.repository }}'
